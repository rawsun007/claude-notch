name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    # macos-15 ships Xcode 16 (Swift 6.x). The app relies on Swift 6's
    # region-based isolation analysis, so it does NOT compile on the Swift 5.10
    # toolchain that older runners (macos-14) default to — pick the newest Xcode.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: swift --version

      - name: Build app target
        run: swift build

      - name: Run tests
        run: swift test

      # A key added in Swift but missing from the table falls back to the key
      # itself, so it looks fine in English and silently cannot be translated.
      - name: Check the English strings table is in sync
        run: tools/l10n-extract.py --check
