name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    # macos-15 ships Xcode 16 (Swift 6.x). The app relies on Swift 6's
    # region-based isolation analysis, so it does NOT compile on the Swift 5.10
    # toolchain that older runners (macos-14) default to — pick the newest Xcode.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: swift --version

      - name: Build app target
        run: swift build

      - name: Run tests
        run: swift test

      # A key added in Swift but missing from the table falls back to the key
      # itself, so it looks fine in English and silently cannot be translated.
      - name: Check the English strings table is in sync
        run: tools/l10n-extract.py --check

      # A missing key silently falls back to English, and a format specifier
      # that does not match the English one can crash String(format:). Neither
      # is visible unless someone runs the app in that language.
      - name: Check the translations against English
        run: tools/l10n-check.py

      # The migration rewrites the user's real settings.json, which holds hooks
      # belonging to other tools. Losing one of those would be silent.
      - name: Test the Vibe Notch migration
        run: tools/test-migrate-from-vibe-notch.sh

      # The updater replaces the app in /Applications, so the version
      # comparison deciding whether to do that has to be right.
      - name: Test the update script
        run: tools/test-update-script.sh

      # These forward every hook Claude Code fires. A failure in one must never
      # become Claude's, so the exit-0 paths are checked as well as the payloads.
      - name: Test the hook forwarders
        run: tools/test-hook-forwarders.sh

      # The blocking hooks. Claude Code waits on their stdout before it may run
      # a tool, so a hang here hangs the session and a stray line of output can
      # be read as a decision the user never made.
      - name: Test the blocking hooks
        run: tools/test-blocking-hooks.sh
